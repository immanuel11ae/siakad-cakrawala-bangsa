    --navy-500:#3C6591;
    --paper:#FAF8F3;
    --paper-line:#E4DFD2;
    --gold:#C9A227;
    --gold-soft:#E9D48B;

  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font-family:inherit;cursor:pointer;}

  .ledger-bg-fine{
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 40px 34px, 40px 34px;

  .nav-ghost-cta{

  /* ===== Hero ===== */

    max-width:1280px;margin:0 auto;

  .eyebrow{
    font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--navy-500);
    display:flex;align-items:center;gap:10px;margin-bottom:22px;

  .eyebrow::before{content:"";width:26px;height:1px;background:var(--gold);}
  .hero h1{
    font-size:clamp(34px,4.2vw,52px);line-height:1.08;font-weight:600;color:var(--navy-950);
    margin:0 0 22px;

  .hero h1 em{font-style:italic;color:var(--navy-700);}
  .hero p{font-size:16.5px;line-height:1.7;color:var(--ink-soft);max-width:480px;margin:0 0 34px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--navy-900);color:var(--paper);padding:14px 26px;border:none;border-radius:var(--radius);
    font-size:14px;font-weight:600;letter-spacing:.3px;
  }
  .btn-primary:hover{background:var(--navy-700);}
  .btn-ghost{
    background:transparent;color:var(--navy-900);padding:14px 26px;border:1px solid var(--navy-900);border-radius:var(--radius);
    font-size:14px;font-weight:600;letter-spacing:.3px;
  }
  .btn-ghost:hover{background:var(--navy-950);color:var(--paper);}

  .hero-panel{
    background:var(--navy-950);border:1px solid var(--navy-700);border-radius:4px;
    padding:0;position:relative;overflow:hidden;

  .hero-panel-inner{position:relative;padding:36px 32px;color:var(--paper);}
  .hero-panel-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:18px;}
  .stat-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .label{font-size:13px;color:#B9C4D0;}
  .stat-row .val{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--gold-soft);}

  /* ===== Section generic ===== */
  .section{padding:80px 48px;max-width:1280px;margin:0 auto;}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:44px;gap:20px;flex-wrap:wrap;}
  .section-head h2{font-size:30px;font-weight:600;color:var(--navy-950);margin:0;}
  .section-head p{color:var(--ink-soft);max-width:420px;font-size:14.5px;line-height:1.6;margin:0;}
  .num-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:10px;display:block;}

  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
  .info-card{

  .info-card p{font-size:14px;color:var(--ink-soft);line-height:1.65;margin:0;}
  .info-card.clickable{cursor:pointer;transition:transform .15s, box-shadow .15s;}
  .info-card.clickable:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(15,42,74,.25);}

  .divider{border:none;border-top:1px solid var(--paper-line);}

  footer{background:var(--navy-950);color:#9FB0C2;padding:50px 48px 30px;margin-top:auto;}
  footer .foot-grid{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px;}
  footer h4{color:var(--paper);font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 12px;}
  footer .foot-bottom{max-width:1280px;margin:34px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  /* ===== Auth pages (login / ppdb) shared shell ===== */
  .auth-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:60px 24px;position:relative;
  }
  .auth-wrap::before{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);

  .auth-card{
    position:relative;width:100%;background:#fff;border:1px solid var(--paper-line);
    border-top:4px solid var(--navy-900);border-radius:3px;padding:44px 38px;
    box-shadow:0 24px 60px -20px rgba(15,42,74,.25);
  }
  .auth-card.narrow{max-width:400px;}
  .auth-card.wide{max-width:640px;}
  .login-crest{display:flex;justify-content:center;margin-bottom:18px;}
  .auth-card h2{text-align:center;font-size:21px;margin:0 0 4px;color:var(--navy-950);}
  .auth-card .sub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:28px;letter-spacing:.3px;}

  .role-toggle{display:flex;gap:8px;margin-bottom:24px;background:var(--paper);padding:5px;border-radius:3px;border:1px solid var(--paper-line);}
  .role-toggle button{
    flex:1;padding:9px;border:none;background:transparent;border-radius:2px;font-size:12.5px;font-weight:600;
    letter-spacing:.3px;color:var(--ink-soft);

  .role-toggle button.active{background:var(--navy-900);color:#fff;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--navy-700);margin-bottom:7px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 13px;border:1px solid #CBD3DA;border-radius:2px;font-size:14.5px;font-family:inherit;

  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-700);outline-offset:1px;border-color:var(--navy-700);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

  .btn-block{
    width:100%;background:var(--navy-900);color:#fff;padding:13px;border:none;border-radius:2px;
    font-size:14px;font-weight:600;letter-spacing:.4px;margin-top:6px;
  }
  .btn-block:hover{background:var(--navy-700);}
  .btn-block:disabled{opacity:.6;cursor:default;}
  .btn-block.secondary{background:transparent;border:1px solid var(--navy-900);color:var(--navy-900);}
  .btn-block.secondary:hover{background:var(--navy-950);color:#fff;}

  .alert{padding:10px 12px;font-size:13px;border-radius:2px;margin-bottom:16px;}

  .alert.success{background:#E9F3ED;color:var(--green);border:1px solid #C5DFD1;}

  .demo-box{margin-top:26px;padding:16px;background:var(--paper);border:1px dashed var(--paper-line);border-radius:2px;}
  .demo-box .t{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy-700);font-weight:600;margin-bottom:9px;}
  .demo-acc{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:5px 0;color:var(--ink-soft);}
  .demo-acc:hover{color:var(--navy-900);}
  .back-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--navy-700);}
  .back-link:hover{text-decoration:underline;}

  /* PPDB extras */
  .ppdb-tabs{display:flex;gap:8px;margin-bottom:24px;}
  .ppdb-tab{flex:1;padding:10px;border:1px solid var(--paper-line);background:#fff;border-radius:2px;font-size:13px;color:var(--ink-soft);text-align:center;}
  .ppdb-tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
  .reg-number{
    font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--navy-900);
    background:var(--paper);border:1px dashed var(--gold);padding:16px;text-align:center;border-radius:2px;margin-bottom:18px;
    letter-spacing:1px;
  }
  .status-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--paper-line);font-size:13.5px;}
  .status-row:last-child{border-bottom:none;}
  .status-row .k{color:var(--ink-soft);}
  .status-row .v{font-weight:600;color:var(--navy-950);}

  /* ===== Dashboard ===== */
  .dash{display:flex;flex:1;}
  .sidebar{width:250px;flex-shrink:0;background:var(--navy-950);color:#C9D3DD;padding:26px 0;display:flex;flex-direction:column;}
  .sidebar .who{padding:0 24px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
  .sidebar .who .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy-950);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;margin-bottom:10px;

  .sidebar .who .n{color:#fff;font-size:14.5px;font-weight:600;}
  .sidebar .who .r{font-size:11.5px;color:#8FA0B2;margin-top:2px;}
  .role-pill{
    display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;
    background:rgba(201,162,39,.16);color:var(--gold-soft);padding:3px 9px;border-radius:20px;font-weight:600;

  .side-link{display:flex;align-items:center;gap:11px;padding:12px 24px;font-size:14px;color:#B9C4D0;border-left:3px solid transparent;}

  .side-link.active{background:rgba(201,162,39,.1);border-left-color:var(--gold);color:#fff;font-weight:600;}
  .side-link .ic{width:16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);}
  .sidebar-bottom{margin-top:auto;padding:14px 24px 0;}
  .logout-btn{width:100%;background:transparent;border:1px solid rgba(255,255,255,.18);color:#C9D3DD;padding:10px;font-size:13px;border-radius:2px;letter-spacing:.3px;}
  .logout-btn:hover{background:rgba(255,255,255,.06);color:#fff;}

  .dash-main{flex:1;padding:40px 48px;background:var(--paper);}
  .dash-head{margin-bottom:32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .dash-head .eyebrow2{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--navy-500);margin-bottom:6px;}
  .dash-head h1{font-size:26px;color:var(--navy-950);margin:0;}
  .print-btn{
    background:var(--navy-900);color:#fff;border:none;padding:11px 20px;border-radius:2px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .print-btn:hover{background:var(--navy-700);}

  .tab-panel{background:#fff;border:1px solid var(--paper-line);border-radius:3px;overflow:hidden;}
  table.grades{width:100%;border-collapse:collapse;}
  table.grades th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy-700);

  }
  table.grades td{padding:13px 20px;border-bottom:1px solid #F0EDE4;font-size:14px;color:var(--ink);}
  table.grades tr:last-child td{border-bottom:none;}
  .grade-val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .grade-val.good{color:var(--green);}
  .grade-val.mid{color:var(--gold);}
  .grade-val.low{color:var(--red);}
  .sem-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .sem-tab{padding:8px 16px;border:1px solid var(--paper-line);background:#fff;border-radius:2px;font-size:13px;color:var(--ink-soft);}
  .sem-tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

  .schedule-grid{display:grid;grid-template-columns:80px repeat(5,1fr);border:1px solid var(--paper-line);border-radius:3px;overflow:hidden;background:#fff;}
  .sched-h{background:var(--navy-900);color:#fff;padding:11px 8px;font-size:11.5px;text-align:center;font-weight:600;letter-spacing:.3px;}
  .sched-time{background:var(--paper);padding:10px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:center;border-top:1px solid var(--paper-line);display:flex;align-items:center;justify-content:center;}
  .sched-cell{padding:8px 7px;border-top:1px solid var(--paper-line);border-left:1px solid var(--paper-line);font-size:11.5px;line-height:1.35;min-height:52px;}
  .sched-cell.filled{background:#F7F6F0;}
  .sched-cell .subj{font-weight:600;color:var(--navy-950);}

  .eskul-list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:24px;}
  .eskul-item{border:1px solid var(--paper-line);border-radius:3px;padding:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .eskul-item .name{font-weight:600;color:var(--navy-950);font-size:14.5px;margin-bottom:4px;}
  .eskul-item .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .badge{font-size:10.5px;padding:4px 9px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:.3px;}
  .badge.joined{background:#E5F0EA;color:var(--green);}
  .badge.open{background:#F1F0EC;color:var(--ink-soft);}
  .eskul-action{font-size:11px;background:none;border:none;color:var(--navy-700);text-decoration:underline;}
  .eskul-action:disabled{color:#B7BEC4;text-decoration:none;cursor:default;}

  .panel-pad{padding:24px;}
  .note-box{background:var(--paper);border:1px solid var(--paper-line);border-radius:2px;padding:14px 16px;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}

  /* ===== Print / PDF rapor ===== */
  .print-only{display:none;}
  #rapor-print{
    padding:50px 60px;font-family:'IBM Plex Sans',sans-serif;color:#1a1a1a;
  }
  #rapor-print .rp-head{display:flex;align-items:center;gap:18px;border-bottom:3px double #0F2A4A;padding-bottom:18px;margin-bottom:26px;}
  #rapor-print .rp-head h2{margin:0;font-size:20px;}
  #rapor-print .rp-head .rp-sub{font-size:12px;color:#555;margin-top:2px;}
  #rapor-print .rp-bio{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;margin-bottom:24px;font-size:13px;}
  #rapor-print .rp-bio .k{color:#555;display:inline-block;width:130px;}
  #rapor-print table{width:100%;border-collapse:collapse;margin-bottom:30px;}
  #rapor-print th,#rapor-print td{border:1px solid #999;padding:8px 10px;font-size:12.5px;text-align:left;}
  #rapor-print th{background:#eee;}
  #rapor-print .rp-sign{display:flex;justify-content:space-between;margin-top:60px;font-size:12.5px;text-align:center;}
  #rapor-print .rp-sign div{width:30%;}
  #rapor-print .rp-sign .line{margin-top:60px;border-top:1px solid #333;padding-top:6px;}

  @media print{
    body *{visibility:hidden;}
    #rapor-print, #rapor-print *{visibility:visible;}
    #rapor-print{position:absolute;top:0;left:0;width:100%;display:block !important;}
  }

  @media (max-width:900px){
    .nav-links{display:none;}
    .hero{grid-template-columns:1fr;padding:70px 24px 50px;}
    .card-grid{grid-template-columns:1fr;}
    .section{padding:56px 24px;}
    .dash{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
    .sidebar .who{display:none;}
    .side-link{padding:8px 14px;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .side-link.active{border-left:none;border-bottom-color:var(--gold);}
    .sidebar-bottom{margin-top:0;padding:0 0 0 8px;}
    .dash-main{padding:26px 20px;}
    .schedule-grid{grid-template-columns:60px repeat(5,1fr);font-size:10px;}
    .eskul-list{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .auth-card{padding:32px 22px;}
  }
</style>
</head>

async function loginSiswa(nisn, password) {
  const rows = await rpc("login_siswa", { p_nisn: nisn, p_password: password });
  return rows && rows.length ? rows[0] : null;
}
async function loginWali(nisn, password) {
  const rows = await rpc("login_wali", { p_nisn: nisn, p_password: password });
  return rows && rows.length ? rows[0] : null;
}
async function fetchGrades(studentId) {
  const rows = await rpc("get_grades", { p_student_id: studentId });
  const grouped = {};
  (rows || []).forEach(r => {
    if (!grouped[r.semester]) grouped[r.semester] = [];
    grouped[r.semester].push({ subj: r.mapel, uh: r.nilai_harian, uts: r.nilai_uts, uas: r.nilai_uas, akhir: r.nilai_akhir });
  });
  return grouped;
}
async function fetchSchedule(kelas) {
  const rows = await rpc("get_schedule", { p_kelas: kelas });
  const days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat"];
  const slotMap = {};
  (rows || []).forEach(r => { slotMap[r.jam_ke] = r.jam_label; });
  const slots = Object.keys(slotMap).sort((a,b)=>a-b).map(k => slotMap[k]);
  const grid = {};
  (rows || []).forEach(r => { grid[`${r.hari}-${r.jam_ke}`] = r.mapel; });
  return { days, slots: slots.length ? slots : ["07.00–08.30"], jamKeList: Object.keys(slotMap).sort((a,b)=>a-b), grid };
}
async function fetchExtracurricular(studentId) {
  return (await rpc("get_extracurricular", { p_student_id: studentId })) || [];
}
async function toggleEskulRpc(id) {
  await rpc("toggle_extracurricular", { p_id: id });
}
async function submitPpdbRpc(form) {
  return await rpc("submit_ppdb", {
    p_nama: form.nama, p_asal_sekolah: form.asalSekolah, p_nisn_asal: form.nisnAsal || null,
    p_jenjang: form.jenjang, p_nama_ortu: form.namaOrtu, p_no_hp: form.noHp,
    p_email: form.email, p_alamat: form.alamat || null,
  });
}
async function checkPpdbStatusRpc(nomor) {
  const rows = await rpc("check_ppdb_status", { p_nomor: nomor });
  return rows && rows.length ? rows[0] : null;
}

function gradeClass(v){ if (v >= 85) return "good"; if (v >= 75) return "mid"; return "low"; }
function predikat(v){
  if (v >= 90) return "A — Sangat Baik";
  if (v >= 80) return "B — Baik";
  if (v >= 70) return "C — Cukup";
  return "D — Perlu Bimbingan";
}

function LoginPage({ onLogin, goHome }) {
  const [role, setRole] = useState("siswa");
  const [nisn, setNisn] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError("");
    try {
      const found = role === "siswa"
        ? await loginSiswa(nisn.trim(), password)
        : await loginWali(nisn.trim(), password);
      if (found) {
        onLogin({ id: found.student_id, nisn: nisn.trim(), name: found.nama, kelas: found.kelas, wali: found.wali_nama, initials: found.initials }, role);
      } else {
        setError("NISN atau kata sandi tidak sesuai untuk peran yang dipilih.");
      }
    } catch (err) {
      setError("Gagal terhubung ke server. Periksa koneksi internet Anda.");
    }
    setLoading(false);
  };

  const fillDemo = (s) => { setNisn(s.nisn); setPassword(role === "siswa" ? s.password : s.waliPassword); };

  return (
    <div className="auth-wrap">
      <div className="auth-card narrow">
        <div className="login-crest"><Crest size={44} /></div>
        <h2>{SCHOOL}</h2>
        <div className="sub">Portal Siswa &amp; Wali Murid</div>

        <div className="role-toggle">
          <button className={role==="siswa" ? "active" : ""} onClick={()=>setRole("siswa")} type="button">Saya Siswa</button>
          <button className={role==="orangtua" ? "active" : ""} onClick={()=>setRole("orangtua")} type="button">Saya Orang Tua</button>
        </div>

        {error && <div className="alert error">{error}</div>}

        <form onSubmit={submit}>
          <div className="field">
            <label>NISN {role === "orangtua" ? "Putra/Putri" : ""}</label>
            <input value={nisn} onChange={e=>setNisn(e.target.value)} placeholder="Contoh: 0091234501" required />
          </div>
          <div className="field">
            <label>Kata Sandi {role === "orangtua" ? "Wali" : ""}</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required />
          </div>
          <button className="btn-block" disabled={loading}>{loading ? "Memeriksa..." : "Masuk ke Portal"}</button>

  );

          )}
        </div>

        {loading && <div className="note-box">Memuat data dari server...</div>}

        {!loading && role === "orangtua" && tab === "eskul" && (
          <div className="note-box">Akun orang tua bersifat pantau saja — pendaftaran/pembatalan ekstrakurikuler hanya dapat dilakukan melalui akun siswa.</div>
        )}

        {!loading && tab === "nilai" && (
          sem ? (
          <>
            <div className="sem-tabs">
              {semesters.map(s => (
                <button key={s} className={"sem-tab" + (s===sem ? " active" : "")} onClick={()=>setSem(s)}>{s}</button>
              ))}
            </div>
            <div className="tab-panel">
              <table className="grades">
                <thead>
                  <tr><th>Mata Pelajaran</th><th>Harian</th><th>UTS</th><th>UAS</th><th>Nilai Akhir</th></tr>
                </thead>
                <tbody>
                  {grades[sem].map((g,i) => (
                    <tr key={i}>
                      <td>{g.subj}</td>
                      <td className="mono">{g.uh}</td>
                      <td className="mono">{g.uts}</td>
                      <td className="mono">{g.uas}</td>
                      <td><span className={"grade-val " + gradeClass(g.akhir)}>{g.akhir}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
          ) : <div className="note-box">Belum ada data nilai untuk siswa ini.</div>
        )}

        {!loading && tab === "jadwal" && sched && (
          <div className="tab-panel panel-pad">
            <div className="schedule-grid">
              <div className="sched-h"></div>
              {sched.days.map(d => <div className="sched-h" key={d}>{d}</div>)}
              {sched.jamKeList.length ? sched.jamKeList.map((jamKe, r) => (
                <React.Fragment key={jamKe}>
                  <div className="sched-time">{sched.slots[r]}</div>
                  {sched.days.map((d, c) => (
                    <div className="sched-cell filled" key={d+c}>
                      <div className="subj">{sched.grid[`${d}-${jamKe}`] || "—"}</div>
                    </div>
                  ))}
                </React.Fragment>
              )) : (
                <div style={{gridColumn:"1 / -1", padding:20, fontSize:13, color:"var(--ink-soft)"}}>Jadwal untuk kelas ini belum diisi di database.</div>
              )}
            </div>
          </div>
        )}

        {!loading && tab === "eskul" && (
          <div className="tab-panel">
            <div className="eskul-list">
              {eskul.map((e) => (
                <div className="eskul-item" key={e.id}>
                  <div>
                    <div className="name">{e.nama}</div>
                    <div className="desc">{e.deskripsi}</div>
                  </div>
                  <div style={{display:"flex", flexDirection:"column", gap:8, alignItems:"flex-end"}}>
                    <span className={"badge " + e.status}>{e.status==="joined" ? "Diikuti" : "Tersedia"}</span>
                    <button className="eskul-action" disabled={role!=="siswa"} onClick={()=>toggleEskul(e.id)}>
                      {e.status==="joined" ? "Keluar" : "Daftar"}
                    </button>
                  </div>
                </div>
              ))}
              {!eskul.length && <div style={{padding:20, fontSize:13, color:"var(--ink-soft)"}}>Belum ada data ekstrakurikuler untuk siswa ini.</div>}
            </div>
          </div>
        )}
      </main>

      <RaporPrint student={student} sem={sem} grades={grades} />
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [view, setView] = useState("landing"); // landing | login | ppdb | dashboard
  const [current, setCurrent] = useState(null);
  const [role, setRole] = useState("siswa");

  if (view === "landing") return <Landing goLogin={()=>setView("login")} goPpdb={()=>setView("ppdb")} />;

  if (view === "ppdb") return <PpdbPage goHome={()=>setView("landing")} goLogin={()=>setView("login")} />;

  if (view === "login") return (
    <LoginPage
      goHome={()=>setView("landing")}
      onLogin={(s, r)=>{ setCurrent(s); setRole(r); setView("dashboard"); }}
    />
  );

  return (
    <Dashboard
      student={current}
      role={role}
      onLogout={()=>{ setCurrent(null); setView("landing"); }}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
